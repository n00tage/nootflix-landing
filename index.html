<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nootflix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Scrolling banner -->
<div class="scroll-banner">
  <span>🎬 New Releases Every Week! Subscribe to Nootflix for endless entertainment! 🍿</span>
</div>

<div class="overlay"></div>

<div class="container">

  <!-- Logo Section -->
  <section class="section logo-section">
    <img src="assets/logo.png" alt="Nootflix Logo" class="logo" />
  </section>

  <!-- Heading Section -->
  <section class="section heading-section">
    <h1>Welcome to Nootflix</h1>
  </section>

  <!-- Description Section -->
  <section class="section description-section">
    <p class="description">
      Dive into endless entertainment with Nootflix – the ultimate subscription service for streaming your favourites anytime, anywhere.
    </p>
  </section>

  <!-- Links Section -->
  <section class="section links-section two-column">
    <div class="column">
      <a href="https://t.me/+Zyokb2khZZo0OWJk" target="_blank" class="telegram-square">
        <img src="assets/telegram.png" alt="Telegram" />
      </a>
    </div>
    <div class="column">
      <img src="assets/qrcode.png" alt="QR Code" class="qr" />
    </div>
  </section>

</div>

<script src="scroll-fade.js"></script>
</body>
</html>
